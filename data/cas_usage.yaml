    "Centre Hospitalier de Niort": []     # visites à domicile et soins
  preuves: [EXP-06, SOC-07, SOC-04]
  usages: ["véhicules municipaux", "trajets domicile travail"]
  ressources: [R-LEMANS, R-NIORT]

