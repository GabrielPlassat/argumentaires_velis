# Cas d'usage envisagés par le destinataire.
# Quand un cas d'usage est choisi (ou repéré dans le texte de contexte), l'argumentaire met en avant
# les retours d'expérimentation sur des usages identiques ou similaires.
#
# mots_cles   repérage automatique dans le champ « Préciser le contexte » (minuscules, sans accent requis)
# motifs      expression régulière appliquée aux motifs saisis dans les carnets de bord 30 vélis
# territoires territoires d'expérimentation documentés pour ce cas d'usage, même quand les carnets ne
#             précisent pas le motif ; valeur = catégories de motif à retenir (vide = tous les carnets)
# preuves     retours d'expérience et faits propres à ce cas d'usage (data/preuves.yaml), par priorité
# usages      cas d'usage correspondants dans le catalogue des vélis à la vente
# ressources  fiches et bilans d'expérimentation (data/ressources.yaml)

agents:
  label: "Déplacements des agents, services techniques, flotte de service"
  mots_cles: [agent, "flotte de service", "vehicule de service", "vehicules de service", "service technique",
              "services techniques", mairie, elus, "parc automobile", "parc de vehicules", "deplacements professionnels"]
  motifs: "r[ée]union|mission|[ée]lu|mairie|travaux|contr[ôo]le de postes|mat[ée]riel|service|permanence|trajet pro|professionn|travail - distribution"
  territoires: {}
  preuves: [EXP-02, EXP-11, LOM-01, CEE-02, EXP-03]
  usages: ["véhicules municipaux", "pour opérateur de maintenance et entretien"]
  ressources: [R-SYNTH30, R-FICHES-TERR, R-LOM]

